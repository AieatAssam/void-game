<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Void Hole</title>
  <meta name="theme-color" content="#0b0618" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud" hidden>
    <div class="pill" id="size">Size <b>0.45</b> m</div>
    <div class="meter"><i id="hunger"></i></div>
    <div class="pill" id="eaten"><b>0</b> swallowed</div>
    <div class="pill stars" id="stars"><span>☆☆☆☆</span><i id="noto"></i></div>
    <div class="pill crave" id="crave" hidden></div>
    <div class="pill" id="left"><b>0</b> buildings left</div>
    <div class="pill card-chip" id="card" hidden></div>
  </div>
  <div id="status"></div>
  <div id="toast"></div>
  <div id="combo"></div>
  <div id="hint"></div>
  <div id="arrow" hidden>➜</div>
  <div id="screen" class="loading">
    <div id="vortex" aria-hidden="true">
      <s></s>
      <b style="--a:0deg;--d:0s" class="house"></b><b style="--a:70deg;--d:-.5s" class="tree"></b><b style="--a:140deg;--d:-1s" class="car"></b>
      <b style="--a:200deg;--d:-1.6s" class="house tall"></b><b style="--a:265deg;--d:-2.1s" class="tree"></b><b style="--a:320deg;--d:-2.6s" class="cow"></b>
      <b style="--a:35deg;--d:-3s" class="car"></b><b style="--a:175deg;--d:-3.5s" class="tree"></b>
    </div>
    <h1 id="title">Void<br /><span>Hole</span></h1>
    <div id="load">
      <div class="bar"><i></i></div>
      <p><span>Unpacking the toybox…</span> <b>0%</b></p>
      <p id="tip" class="hint"></p>
    </div>
    <div id="menu" hidden>
      <p id="result" hidden></p>
      <p id="where" class="hint"></p>
      <div id="cities" class="cities"></div>
      <div class="row">
        <button id="play">Open the ground</button>
        <button id="daily" class="alt">Daily city</button>
        <button id="weekly" class="alt">Weekly</button>
        <button id="blitz" class="alt" title="Grow as big as you can in two minutes">Blitz 2:00</button>
      </div>
      <div id="heat" class="heat" hidden></div>
      <div id="contracts" class="contracts"></div>
      <div id="cards" class="cards"></div>
      <div class="row">
        <button id="shopBtn" class="ghost">Shop · <b id="dust">0</b> void dust</button>
        <button id="bookBtn" class="ghost">Collection · <b>0/0</b></button>
      </div>
      <div id="shop" hidden></div>
      <div id="book" hidden></div>
      <p class="hint">Steer with mouse, touch-drag or WASD. Swallow what fits. Keep eating or the ground seals. Watch the red rings.</p>
    </div>
  </div>
  <button id="mute" title="Sound (M)">♪</button>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
