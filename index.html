<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Void Hole City</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud" hidden>
    <div class="pill" id="size">Size <b>0.45</b> m</div>
    <div class="meter"><i id="hunger"></i></div>
    <div class="pill" id="eaten"><b>0</b> swallowed</div>
    <div class="pill stars" id="stars"><span>☆☆☆☆</span><i id="noto"></i></div>
    <div class="pill crave" id="crave" hidden></div>
    <div class="pill" id="left"><b>0</b> buildings left</div>
    <div class="pill card-chip" id="card" hidden></div>
  </div>
  <div id="status"></div>
  <div id="toast"></div>
  <div id="combo"></div>
  <div id="hint"></div>
  <div id="arrow" hidden>➜</div>
  <div id="screen">
    <h1 id="title">Void Hole<br /><span>City</span></h1>
    <p id="load">Unpacking the toybox… <b>0%</b></p>
    <div id="menu" hidden>
      <p id="result" hidden></p>
      <p id="where" class="hint"></p>
      <div class="row">
        <button id="play">Open the ground</button>
        <button id="daily" class="alt">Daily city</button>
      </div>
      <div id="cards" class="cards"></div>
      <div class="row">
        <button id="shopBtn" class="ghost">Shop · <b id="dust">0</b> void dust</button>
        <button id="bookBtn" class="ghost">Collection · <b>0/0</b></button>
      </div>
      <div id="shop" hidden></div>
      <div id="book" hidden></div>
      <p class="hint">Steer with mouse, touch-drag or WASD. Swallow what fits. Keep eating or the ground seals. Watch the red rings.</p>
    </div>
  </div>
  <button id="mute" title="Sound (M)">♪</button>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
